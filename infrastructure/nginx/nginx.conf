# Reverse proxy для TOPLA: маршрутизация по поддоменам к API/Web/Admin.
# Production-версия дополняется TLS (Let's Encrypt) на ШАГ 17.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  upstream topla_api {
    server api:3000;
  }

  upstream topla_web {
    server web:3001;
  }

  upstream topla_admin {
    server admin:3002;
  }

  server {
    listen 80;
    server_name api.topla.local;

    location / {
      proxy_pass http://topla_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name topla.local www.topla.local;

    location / {
      proxy_pass http://topla_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name admin.topla.local seller.topla.local;

    location / {
      proxy_pass http://topla_admin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
